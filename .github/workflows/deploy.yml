name: Deploy Yesang Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 10222
          source: "."
          target: "~/Yesang-Backend"
          # Preserve server-only files such as .env and Apple private keys.
          rm: false
          overwrite: true
          strip_components: 0
          tar_dereference: true
          exclude: ".git,.github,node_modules,dist,.env,coverage,.DS_Store"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 10222
          script: |
            cd ~/Yesang-Backend
            docker compose up -d --build
            docker ps
